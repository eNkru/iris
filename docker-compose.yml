# Iris — one container, one image, one persistent data volume.
# Anti-detect fetching runs in the external argus service (deployed from the
# argus repo); iris calls it over HTTP with bearer auth.
services:
  app:
    build:
      context: .
      args:
        DATABASE_PATH: /app/data/iris.db
    restart: unless-stopped
    # Lets the container resolve host.docker.internal on LINUX hosts too (QNAP
    # etc.) where argus may run on the same machine as the container. On Docker
    # Desktop (macOS/Windows) the name already resolves natively.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_PATH: /app/data/iris.db
      # Argus — the external fetch transport. Point ARGUS_BASE_URL at a
      # reachable argus instance and set ARGUS_API_TOKEN to one of its
      # ARGUS_API_TOKENS values (compose up fails without a token).
      ARGUS_BASE_URL: ${ARGUS_BASE_URL:-http://localhost:8000}
      ARGUS_API_TOKEN: ${ARGUS_API_TOKEN:?set ARGUS_API_TOKEN in .env (must match argus ARGUS_API_TOKENS)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-30000}
    ports:
      - "3000:3000"
    volumes:
      - iris-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/rpc/health/check >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  iris-data:
