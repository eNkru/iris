packages:
  - apps/*
  - packages/*
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  postcss: ^8.5.23
  sharp: ^0.35.0
  nanoid: ^3.3.18
  js-yaml: ^4.3.1
  esbuild: ^0.25.3
  # Security: force versions with GHSA patches for transitive install-graph
  # advisories. These complement the in-package bumps in
  # packages/auth/package.json (nodemailer) and apps/web/package.json (hono).
  next: ^15.5.24           # GHSA-p293-qw3h-jr36, GHSA-2xp9-vwfh-vxw4 (better-auth optional peer; not used at runtime, but flags the install graph)
  vitest: ^4.1.11          # GHSA-82fw-gwwq-j7x9 (vitest @vitest/mocker path-traversal, dev-only; requires vitest 4 in vitest.config.ts)
  undici: ^8.10.2          # 8 advisories via vitest>jsdom (transitive Fetch impl in jsdom; dev-only)
  brace-expansion: ^5.0.12 # 3 advisories via minimatch (eslint / typescript-eslint dev chain, dev-only)
